    <text x="1140" y="60" text-anchor="end" fill="#5c5f69" font-size="18">5 courses / 3 perspectives</text>
    <text x="52" y="219" fill="#16171b" font-size="160" font-weight="600" letter-spacing="-8"><tspan fill="#c4162f">muse</tspan>learning</text>
    <text x="60" y="285" fill="#16171b" font-size="36" font-weight="400" letter-spacing="-1">Less to manage. More to learn.</text>
  </g>
