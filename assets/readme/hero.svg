<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">muselearning — Less to manage. More to learn.</title>
  <desc id="hero-desc">A learning management demo with five sample courses and three personas. A curriculum timeline shows the first four Web Development units: HTML, CSS, JavaScript, and React.</desc>
