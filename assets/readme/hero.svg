    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1f5fa8"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#f7f7f8"/>
  <g font-family="Geist, system-ui, sans-serif">
